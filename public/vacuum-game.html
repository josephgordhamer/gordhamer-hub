  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }

    background:linear-gradient(170deg,#bfe9f0 0%,#a6dbe6 45%,#d8ecc4 100%);

  }
  #app{

  }

    display:flex; align-items:center; gap:8px; margin-top:6px;
  }
  #pctBox{
    background:#fff; border-radius:14px; padding:5px 10px; flex:0 0 auto;
    box-shadow:0 3px 0 #8fb9bf; text-align:center; min-width:96px;
  }

    border-radius:9px; transition:width .18s ease;
  }
  #effLine{ font-size:11px; color:#5a6770; margin-top:3px; text-align:left; padding-left:4px; }
  #iconBtns{ display:flex; gap:6px; flex:0 0 auto; }
  .icoBtn{
    width:42px; height:42px; border:none; border-radius:12px; background:#fff;
    box-shadow:0 3px 0 #8fb9bf; font-size:19px; cursor:pointer; color:#2b8f9b;
    display:flex; align-items:center; justify-content:center;
  }
  .icoBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #8fb9bf; }
  #boardWrap{
    position:relative; flex:1 1 auto; display:flex; align-items:center;
    justify-content:center; min-height:0;
  }
  #game{
    display:block; background:#cdbb9c; border-radius:18px;
    box-shadow:0 8px 22px rgba(20,50,55,.32);
    touch-action:none; max-width:100%; max-height:100%;
  }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    border-radius:18px; padding:22px;
  }
  #startScreen{
    background:linear-gradient(165deg,rgba(43,179,163,.95),rgba(31,138,90,.95));
    color:#fff;
  }
  #startScreen h2{ font-size:clamp(22px,7vw,32px); margin:6px 0; text-shadow:0 3px 0 rgba(0,0,0,.18); }
  #startScreen p{ font-size:14px; max-width:300px; line-height:1.5; opacity:.96; margin:8px 0; }
  .bigBtn{
    border:none; border-radius:18px; padding:14px 30px; font-size:19px;
    font-weight:bold; font-family:inherit; cursor:pointer; margin-top:12px;
    background:#ffd34d; color:#5a4400; box-shadow:0 5px 0 #d9a800;
  }
  .bigBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #d9a800; }
  #results{ background:rgba(255,255,255,.0); pointer-events:none; opacity:0;
    transition:opacity .35s ease; }
  #results.show{ opacity:1; pointer-events:auto; }
  #resultCard{
    background:#fff; border-radius:22px; padding:20px 22px 22px; max-width:330px;
    box-shadow:0 12px 30px rgba(20,50,55,.4); transform:scale(.8);
    transition:transform .4s cubic-bezier(.2,1.4,.5,1);
  }
  #results.show #resultCard{ transform:scale(1); }
  #resultCard h2{ margin:2px 0 6px; font-size:24px; color:#16707f; }
  #stars{ font-size:40px; letter-spacing:4px; margin:6px 0; }
  .star-empty{ color:#dfe6e6; }
  .star-full{ color:#ffc328; text-shadow:0 2px 3px rgba(220,150,0,.4); }
  #resultStats{ font-size:14px; color:#48555e; line-height:1.7; margin:8px 0; }
  #resultStats b{ color:#1f8a5a; }
  #resultMsg{ font-size:13px; color:#6a7680; margin:6px 0 2px; }
  #msgBanner{
    position:absolute; left:50%; top:14px; transform:translateX(-50%) translateY(-14px);
    background:rgba(255,255,255,.96); color:#1d6f6a; font-weight:bold;
    padding:9px 16px; border-radius:14px; font-size:13.5px; max-width:88%;
    box-shadow:0 5px 14px rgba(20,50,55,.28); opacity:0;
    transition:opacity .3s ease, transform .3s ease; pointer-events:none;
    text-align:center;
  }
  #msgBanner.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #footer{ flex:0 0 auto; display:flex; gap:8px; align-items:center; }
  #hintText{ flex:1 1 auto; font-size:12px; color:#3f6e6a; padding-left:4px; }
  #doneBtn{
    border:none; border-radius:13px; padding:9px 16px; font-size:14px; font-weight:bold;
    font-family:inherit; background:#ff9166; color:#fff; box-shadow:0 4px 0 #d96a3f;
    cursor:pointer; flex:0 0 auto;
  }
  #doneBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #d96a3f; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Vacuum the Family Room</h1>
    <div id="statRow">
      <div id="pctBox">
        <div id="pctNum">0%</div>
        <div id="pctLbl">CLEAN</div>
      </div>
      <div id="barWrap">
        <div id="barTrack"><div id="barFill"></div></div>
        <div id="effLine">Efficiency: &mdash;</div>
      </div>
      <div id="iconBtns">
        <button class="icoBtn" id="soundBtn" title="Sound">&#128266;</button>
      </div>
    </div>
  </header>

  <div id="boardWrap">
    <canvas id="game"></canvas>
    <div id="msgBanner"></div>
    <div class="overlay" id="startScreen">
      <h2>Vacuum Quest</h2>
      <p>Drag the robot vacuum around the floor and clean up every speck of dust!</p>
      <p style="font-size:12.5px;opacity:.85">Can you reach a sparkling <b>100%</b>?</p>
      <button class="bigBtn" id="startBtn">Start Cleaning</button>
    </div>
    <div class="overlay" id="results">
      <div id="resultCard">
        <h2 id="resultTitle">Great Job!</h2>
        <div id="stars"></div>
        <div id="resultStats"></div>
        <div id="resultMsg"></div>
        <button class="bigBtn" id="againBtn">Play Again</button>
      </div>
    </div>
  </div>

  <div id="footer">
    <div id="hintText">Drag to vacuum the floor.</div>
    <button id="doneBtn">I&rsquo;m Done</button>
  </div>
</div>

// ---- audio (realistic vacuum) ----
let actx=null, vacGain=null, vacOsc=null, vacOsc2=null, vacHiss=null,
    vacRoar=null, muted=false, audioOn=false;
function initAudio(){
  if(actx) return;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const sr=actx.sampleRate, len=sr*2;
    // white noise
    const wbuf=actx.createBuffer(1,len,sr), wd=wbuf.getChannelData(0);
    for(let i=0;i<len;i++) wd[i]=Math.random()*2-1;
    // brown (low) noise
    const bbuf=actx.createBuffer(1,len,sr), bd=bbuf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const wn=Math.random()*2-1; last=(last+0.02*wn)/1.02; bd[i]=last*3.4; }

    vacGain=actx.createGain(); vacGain.gain.value=0;
    vacGain.connect(actx.destination);
    const noiseSrc=b=>{ const s=actx.createBufferSource(); s.buffer=b; s.loop=true; return s; };

    // 1) deep motor rumble
    const rum=noiseSrc(bbuf);
    const rLP=actx.createBiquadFilter(); rLP.type="lowpass"; rLP.frequency.value=230;
    const rG=actx.createGain(); rG.gain.value=0.55;
    rum.connect(rLP); rLP.connect(rG); rG.connect(vacGain);

    // 2) broad airflow roar
    const roar=noiseSrc(wbuf);
    vacRoar=actx.createBiquadFilter(); vacRoar.type="bandpass";
    vacRoar.frequency.value=560; vacRoar.Q.value=0.7;
    const roarG=actx.createGain(); roarG.gain.value=0.5;
    roar.connect(vacRoar); vacRoar.connect(roarG); roarG.connect(vacGain);

    // 3) high suction hiss
    const hiss=noiseSrc(wbuf);
    vacHiss=actx.createBiquadFilter(); vacHiss.type="highpass"; vacHiss.frequency.value=2600;
    const hissG=actx.createGain(); hissG.gain.value=0.16;
    hiss.connect(vacHiss); vacHiss.connect(hissG); hissG.connect(vacGain);

    // 4) tonal motor whine (two detuned saws -> resonant filter)
    vacOsc=actx.createOscillator();  vacOsc.type="sawtooth";  vacOsc.frequency.value=210;
    vacOsc2=actx.createOscillator(); vacOsc2.type="sawtooth"; vacOsc2.frequency.value=215.5;
    const wLP=actx.createBiquadFilter(); wLP.type="lowpass";
    wLP.frequency.value=3200; wLP.Q.value=6;
    const wG=actx.createGain(); wG.gain.value=0.06;
    vacOsc.connect(wLP); vacOsc2.connect(wLP); wLP.connect(wG); wG.connect(vacGain);

    rum.start(); roar.start(); hiss.start(); vacOsc.start(); vacOsc2.start();
    audioOn=true;
  }catch(e){ audioOn=false; }
}
function vacSound(on,speed){
  if(!audioOn||muted){ if(vacGain&&actx) vacGain.gain.setTargetAtTime(0,actx.currentTime,0.09); return; }
  const t=actx.currentTime, sp=Math.min(speed,18);
  const tgt = on ? 0.34+sp*0.006 : 0;
  vacGain.gain.setTargetAtTime(tgt, t, on?0.05:0.14);
  if(on){
    vacOsc.frequency.setTargetAtTime(204+sp*2.3, t, 0.09);
    vacOsc2.frequency.setTargetAtTime(209+sp*2.3, t, 0.09);
    vacRoar.frequency.setTargetAtTime(520+sp*16, t, 0.08);
  }
}

// ---- load assets ----
function tryStart(){ /* assets loaded; wait for user Start */ }
const _bg=new Image();
_bg.onload=()=>{ bgImg=_bg; imgReady=true; };
_bg.src=BG_SRC;
const _mask=new Image();
_mask.onload=()=>{
  const t=document.createElement("canvas"); t.width=W; t.height=H;
  const tg=t.getContext("2d"); tg.drawImage(_mask,0,0,W,H);
  const im=tg.getImageData(0,0,W,H), px=im.data;
  // build coverage grid
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const sx=Math.min(W-1,c*CELL+(CELL>>1)), sy=Math.min(H-1,r*CELL+(CELL>>1));
      const v=px[(sy*W+sx)*4];
      if(v>128){ cellFloor[r*COLS+c]=1; totalFloor++; }
    }
  }
  // openMax = floor cells not under any furniture initial footprint
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(!cellFloor[r*COLS+c]) continue;
      const cx=c*CELL+(CELL>>1), cy=r*CELL+(CELL>>1);
      let blk=false;
      for(const f of FURN){
        if(cx>f.x+F_INSET&&cx<f.x+f.w-F_INSET&&cy>f.y+F_INSET&&cy<f.y+f.h-F_INSET){blk=true;break;}
      }
      if(!blk) openMax++;
    }
  }
  // build dust layer, clipped to floor via alpha mask
  buildDust(im);
  maskReady=true;
};
_mask.src=MASK_SRC;

function buildDust(maskImage){
  // alpha mask canvas: floor -> opaque
  const am=document.createElement("canvas"); am.width=W; am.height=H;
  const ag=am.getContext("2d");
  const aim=ag.createImageData(W,H);
  for(let i=0;i<W*H;i++){
    const v=maskImage.data[i*4];
    aim.data[i*4]=255; aim.data[i*4+1]=255; aim.data[i*4+2]=255;
    aim.data[i*4+3]= v>128?255:0;
  }
  ag.putImageData(aim,0,0);
  // dust base
  dctx.clearRect(0,0,W,H);
  dctx.fillStyle="rgba(123,114,99,0.60)";
  dctx.fillRect(0,0,W,H);
  // mottled dust patches
  for(let i=0;i<150;i++){
    const x=Math.random()*W, y=Math.random()*H, rr=14+Math.random()*46;
    dctx.fillStyle="rgba(95,86,72,"+(0.10+Math.random()*0.16)+")";
    dctx.beginPath(); dctx.arc(x,y,rr,0,7); dctx.fill();
  }
  // little dust specks / lint / crumbs
  for(let i=0;i<1500;i++){
    const x=Math.random()*W, y=Math.random()*H, s=0.6+Math.random()*2.6;
    const dk=Math.random();
    dctx.fillStyle = dk<0.5 ? "rgba(74,66,53,0.7)"
                  : dk<0.8 ? "rgba(110,98,80,0.7)"
                           : "rgba(150,140,120,0.65)";
    dctx.beginPath(); dctx.arc(x,y,s,0,7); dctx.fill();
  }
  // a few bigger fuzzy bits
  for(let i=0;i<60;i++){
    const x=Math.random()*W, y=Math.random()*H;
    dctx.strokeStyle="rgba(80,72,58,0.55)"; dctx.lineWidth=1.4;
    dctx.beginPath();
    for(let k=0;k<5;k++){
      const a=Math.random()*7, l=3+Math.random()*7;
      dctx.moveTo(x,y); dctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);
    }
    dctx.stroke();
  }
  // clip everything to floor
  dctx.globalCompositeOperation="destination-in";
  dctx.drawImage(am,0,0);
  dctx.globalCompositeOperation="source-over";
}

// ---- geometry helpers ----
function furnAABB(f){ return {x:f.x+(f.dx||0), y:f.y+(f.dy||0), w:f.w, h:f.h}; }
function onFloorPt(x,y){
  const c=(x/CELL)|0, r=(y/CELL)|0;
  if(c<0||r<0||c>=COLS||r>=ROWS) return false;
  return cellFloor[r*COLS+c]===1;
}
function blockedAt(px,py){
  for(const f of FURN){
    if(f.lifted) continue;
    const a=furnAABB(f);
    if(px>a.x+F_INSET&&px<a.x+a.w-F_INSET&&py>a.y+F_INSET&&py<a.y+a.h-F_INSET) return true;
  }
  return false;
}
function furnitureAt(px,py){
  for(let i=FURN.length-1;i>=0;i--){
    const f=FURN[i], a=furnAABB(f);
    if(px>a.x&&px<a.x+a.w&&py>a.y&&py<a.y+a.h) return f;
  }
  return null;
}

// ---- vacuuming ----
function markCells(x,y){
  const r=CLEAN_R, c0=Math.max(0,((x-r)/CELL)|0), c1=Math.min(COLS-1,((x+r)/CELL)|0);
  const r0=Math.max(0,((y-r)/CELL)|0), r1=Math.min(ROWS-1,((y+r)/CELL)|0);
  const r2=r*r;
  for(let r_=r0;r_<=r1;r_++){
    for(let c=c0;c<=c1;c++){
      const idx=r_*COLS+c;
      if(!cellFloor[idx]||cellCov[idx]) continue;
      const cx=c*CELL+(CELL>>1), cy=r_*CELL+(CELL>>1);
      const dx=cx-x, dy=cy-y;
      if(dx*dx+dy*dy<=r2 && !blockedAt(cx,cy)){
        cellCov[idx]=1; coveredCount++;
      }
    }
  }
}
function eraseStroke(x0,y0,x1,y1){
  // erase dust + add sheen along the segment, excluding furniture
  const steps=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/5));
  dctx.save();
  dctx.beginPath(); dctx.rect(0,0,W,H);
  for(const f of FURN){ if(f.lifted) continue; const a=furnAABB(f);
    dctx.rect(a.x+F_INSET,a.y+F_INSET,a.w-2*F_INSET,a.h-2*F_INSET); }
  dctx.clip("evenodd");
  dctx.globalCompositeOperation="destination-out";
  for(let i=0;i<=steps;i++){
    const t=i/steps, x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    dctx.drawImage(brush,x-CLEAN_R,y-CLEAN_R);
  }
  dctx.restore();
  // sheen (freshly-vacuumed shine)
  shctx.save();
  shctx.beginPath(); shctx.rect(0,0,W,H);
  for(const f of FURN){ if(f.lifted) continue; const a=furnAABB(f);
    shctx.rect(a.x+F_INSET,a.y+F_INSET,a.w-2*F_INSET,a.h-2*F_INSET); }
  shctx.clip("evenodd");
  shctx.strokeStyle="rgba(255,255,255,0.16)";
  shctx.lineWidth=CLEAN_R*1.7; shctx.lineCap="round"; shctx.lineJoin="round";
  shctx.beginPath(); shctx.moveTo(x0,y0); shctx.lineTo(x1,y1); shctx.stroke();
  shctx.restore();
}
function vacuumTo(p){
  if(!lastV) lastV={x:p.x,y:p.y};
  const seg=Math.hypot(p.x-lastV.x,p.y-lastV.y);
  const before=coveredCount;
  // sample cells along the path
  const steps=Math.max(1,Math.round(seg/(CELL*0.8)));
  for(let i=1;i<=steps;i++){
    const t=i/steps;
    markCells(lastV.x+(p.x-lastV.x)*t, lastV.y+(p.y-lastV.y)*t);
  }
  eraseStroke(lastV.x,lastV.y,p.x,p.y);
  // swept area = floor portion of this stroke x brush width
  let onF=0, ns=Math.max(2,Math.round(seg/40));
  for(let i=0;i<=ns;i++){
    const t=i/ns, sx=lastV.x+(p.x-lastV.x)*t, sy=lastV.y+(p.y-lastV.y)*t;
    if(onFloorPt(sx,sy)&&!blockedAt(sx,sy)) onF++;
  }
  sweptArea += seg*(onF/(ns+1))*CLEAN_R*2;
  // suck-in particles where dust was just removed
  if(coveredCount>before){
    for(let i=0;i<3;i++){
      const a=Math.random()*7, d=CLEAN_R*(0.5+Math.random()*0.6);
      particles.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,life:1,
        size:1.5+Math.random()*3});
    }
  }
  robot.x=p.x; robot.y=p.y; lastV={x:p.x,y:p.y};
  vacSound(true, seg);
  updateHUD();
  checkProgress();
}

// ---- furniture drag ----
function startFurnitureGrab(f,p){
  grabFurn=f; f.lifted=true; f.wob=0;
  grabOff={x:p.x-(f.x+(f.dx||0)), y:p.y-(f.y+(f.dy||0))};
  mode="furn-drag"; robotShown=false;
  beep(360,0.07,0.5);
}
function dragFurnitureTo(p){
  const f=grabFurn;
  let nx=p.x-grabOff.x, ny=p.y-grabOff.y;
  nx=Math.max(-f.w*0.35,Math.min(W-f.w*0.65,nx));
  ny=Math.max(-f.h*0.30,Math.min(H-f.h*0.62,ny));
  f.dx=nx-f.x; f.dy=ny-f.y;
  f.wob=Math.sin(performance.now()/90)*0.035;
}
function dropFurniture(){
  const f=grabFurn; f.lifted=false; f.wob=0;
  beep(220,0.10,0.55);
  if((f.dx||f.dy) && !movedAny){
    movedAny=true;
    showMsg("Whoa, it moves! Vacuum the hidden dust under there.",2600);
  }
  grabFurn=null;
}
function jiggle(f){
  f.jig=1; tapHints++;
  if(tapHints>=2 && !movedAny) showMsg("Tip: press and HOLD furniture to slide it.",2400);
}
function beep(freq,dur,vol){
  if(!audioOn||muted) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.frequency.value=freq; o.type="sine";
  g.gain.value=vol*0.18;
  g.gain.setTargetAtTime(0,actx.currentTime+0.01,dur*0.5);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur+0.1);
}

// ---- progress / messages ----
function pct(){ return totalFloor? coveredCount/totalFloor : 0; }
function overlap(){
  const covA=coveredCount*cellArea;
  return covA>800 ? sweptArea/covA : 1;
}
function updateHUD(){
  const p=Math.round(pct()*100);
  document.getElementById("pctNum").textContent=p+"%";
  document.getElementById("barFill").style.width=p+"%";
  const ov=overlap();
  document.getElementById("effLine").innerHTML =
    coveredCount*cellArea>4000 ? "Efficiency: "+effWord(ov)+" ("+ov.toFixed(1)+"x)"
                               : "Efficiency: &mdash;";
}
function effWord(ov){
  if(ov<=1.35) return "Master";
  if(ov<=1.7)  return "Super";
  if(ov<=2.2)  return "Good";
  if(ov<=3.0)  return "Okay";
  return "Lots of passes";
}
let msgTimer=0;
function showMsg(text,ms){
  const b=document.getElementById("msgBanner");
  b.textContent=text; b.classList.add("show");
  clearTimeout(msgTimer);
  msgTimer=setTimeout(()=>b.classList.remove("show"), ms||2200);
}
function checkProgress(){
  const p=pct()*100;
  for(const m of [25,50,75,90]){
    if(p>=m && !milestones[m]){
      milestones[m]=true;
      if(m===25) showMsg("Good start — keep it steady!",2000);
      if(m===50) showMsg("Halfway there! The carpet looks great.",2200);
      if(m===75) showMsg("Looking good — don't miss any spots!",2200);
      if(m===90) showMsg("So close! Track down that last dust.",2400);
    }
  }
  if(!movedAny && !furnHintShown && coveredCount>=openMax-4){
    furnHintShown=true;
    showMsg("Psst… dust hides under furniture. Press & HOLD a piece to move it!",4200);
    for(const f of FURN) f.pulse=1;
  }
  if(!finished && pct()>=0.998){ finish(true); }
}

// ---- finish / results ----
function finish(perfect){
  if(finished) return;
  finished=true; mode="idle"; vacSound(false,0);
  const cov=pct(), ov=overlap();
  let stars;
  if(cov>=0.998) stars = ov<=2.1?3:2;
  else if(cov>=0.90) stars = ov<=2.3?2:1;
  else if(cov>=0.60) stars=1;
  else stars=0;
  const titles=["Keep Practicing!","Nice Effort!","Great Job!","Spotless Superstar!"];
  document.getElementById("resultTitle").textContent=titles[stars];
  let sHtml="";
  for(let i=0;i<3;i++) sHtml+= "<span class='"+(i<stars?"star-full":"star-empty")+"'>★</span>";
  document.getElementById("stars").innerHTML=sHtml;
  document.getElementById("resultStats").innerHTML=
    "Floor cleaned: <b>"+Math.round(cov*100)+"%</b><br>"+
    "Efficiency: <b>"+effWord(ov)+"</b> &mdash; "+ov.toFixed(2)+"x passes<br>"+
    "Furniture moved: <b>"+FURN.filter(f=>f.dx||f.dy).length+" of "+FURN.length+"</b>";
  let msg;
  if(stars===3) msg="Amazing — every speck gone with barely any wasted passes!";
  else if(stars===2 && cov>=0.998) msg="The whole room is sparkling! Try fewer overlapping passes for 3 stars.";
  else if(stars===2) msg="Really good! Get every last spot to hit 100%.";
  else if(stars===1) msg="Nice work — keep going for the spots you missed!";
  else msg="Give it another go and clean a little more of the floor!";
  document.getElementById("resultMsg").textContent=msg;
  document.getElementById("results").classList.add("show");
  if(cov>=0.998) spawnConfetti();
}
function spawnConfetti(){
  const cols=["#ffd34d","#ff9166","#5fd0a8","#5bb8e6","#e87fb8","#9ed85b"];
  function burst(n){
    for(let i=0;i<n;i++){
      confetti.push({
        x:Math.random()*W, y:-20-Math.random()*H*0.45,
        vx:(Math.random()-0.5)*2.2, vy:2.4+Math.random()*3.6,
        rot:Math.random()*7, vr:(Math.random()-0.5)*0.34,
        size:7+Math.random()*9, col:cols[(Math.random()*cols.length)|0],
        phase:Math.random()*100
      });
    }
  }
  burst(120);
  setTimeout(()=>burst(90),420);
  setTimeout(()=>burst(90),900);
  setTimeout(()=>burst(70),1500);
}

// ---- drawing furniture ----
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function drawFurniture(f){
  const a=furnAABB(f);
  let cx=a.x+a.w/2, cy=a.y+a.h/2;
  let sc=1;
  if(f.lifted) sc=1.07;
  if(f.jig){ f.jig*=0.82; if(f.jig<0.02)f.jig=0; }
  if(f.pulse){ f.pulse*=0.94; if(f.pulse<0.02)f.pulse=0; }
  const jx=f.jig?Math.sin(performance.now()/26)*5*f.jig:0;
  const pulseGlow=f.pulse?f.pulse:0;
  ctx.save();
  ctx.translate(cx+jx,cy);
  if(f.wob) ctx.rotate(f.wob);
  ctx.scale(sc,sc);
  ctx.translate(-a.w/2,-a.h/2);
  // shadow
  ctx.save();
  const so=f.lifted?14:5;
  ctx.fillStyle="rgba(20,35,30,"+(f.lifted?0.32:0.22)+")";
  ctx.filter="blur(6px)";
  rr(ctx,so*0.4,a.h*0.12+so,a.w,a.h*0.93,26); ctx.fill();
  ctx.restore();
  if(pulseGlow>0){
    ctx.save();
    ctx.strokeStyle="rgba(255,211,77,"+(0.85*pulseGlow)+")";
    ctx.lineWidth=5; ctx.filter="blur(2px)";
    rr(ctx,-4,-4,a.w+8,a.h+8,24); ctx.stroke();
    ctx.restore();
  }
  if(f.type==="sofa") drawSofa(f,a.w,a.h);
  else drawTable(f,a.w,a.h);
  ctx.restore();
}
function drawSofa(f,w,h){
  const back=f.back, T=Math.min(w,h)*0.30;  // back/arm thickness
  // body frame
  ctx.fillStyle=f.frame; rr(ctx,0,0,w,h,22); ctx.fill();
  // seat zone (inner)
  let sx=6,sy=6,sw=w-12,sh=h-12;
  if(back==="left"){ sx=T; sw=w-T-6; }
  if(back==="right"){ sw=w-T-6; }
  if(back==="top"){ sy=T; sh=h-T-6; }
  if(back==="bottom"){ sh=h-T-6; }
  ctx.fillStyle=f.main; rr(ctx,sx,sy,sw,sh,16); ctx.fill();
  // back cushion
  ctx.fillStyle=f.cush;
  if(back==="left"){ rr(ctx,6,6,T-4,h-12,14); ctx.fill(); }
  else if(back==="right"){ rr(ctx,w-T+ -2,6,T-4,h-12,14); ctx.fill(); }
  else if(back==="bottom"){ rr(ctx,6,h-T+2,w-12,T-4,14); ctx.fill(); }
  else { rr(ctx,6,6,w-12,T-4,14); ctx.fill(); }
  // arms
  ctx.fillStyle=f.main;
  if(back==="left"||back==="right"){
    rr(ctx,sx,6,sw,T*0.7,12); ctx.fill();
    rr(ctx,sx,h-6-T*0.7,sw,T*0.7,12); ctx.fill();
  }else{
    rr(ctx,6,sy,T*0.7,sh,12); ctx.fill();
    rr(ctx,w-6-T*0.7,sy,T*0.7,sh,12); ctx.fill();
  }
  // seat cushions
  ctx.fillStyle=f.cush;
  const vertical=(back==="left"||back==="right");
  let n = vertical ? 3 : 2;
  for(let i=0;i<n;i++){
    let cw,ch,cxp,cyp;
    if(vertical){
      ch=(sh-T*0.7*2-10)/n - 4; cw=sw-14;
      cxp=sx+7; cyp=6+T*0.7+5 + i*((sh-T*0.7*2-10)/n);
    }else{
      cw=(sw-T*0.7*2-10)/n - 4; ch=sh-14;
      cyp=sy+7; cxp=6+T*0.7+5 + i*((sw-T*0.7*2-10)/n);
    }
    rr(ctx,cxp,cyp,cw,ch,11); ctx.fill();
  }
  // top highlight + outline
  ctx.strokeStyle="rgba(255,255,255,0.30)"; ctx.lineWidth=2;
  rr(ctx,sx+3,sy+3,sw-6,sh-6,13); ctx.stroke();
  ctx.strokeStyle="rgba(30,30,20,0.45)"; ctx.lineWidth=2.4;
  rr(ctx,1,1,w-2,h-2,22); ctx.stroke();
}
function drawTable(f,w,h){
  // dark wood table with a lighter inset top
  ctx.fillStyle="#4f3722"; rr(ctx,0,0,w,h,16); ctx.fill();
  ctx.fillStyle="#6b4a30"; rr(ctx,3,3,w-6,h-6,13); ctx.fill();
  ctx.fillStyle="#825c3d"; rr(ctx,9,9,w-18,h-18,10); ctx.fill();
  // wood grain
  ctx.strokeStyle="rgba(60,40,24,0.35)"; ctx.lineWidth=1.4;
  for(let i=1;i<4;i++){
    ctx.beginPath();
    const yy=9+(h-18)*i/4;
    ctx.moveTo(12,yy); ctx.bezierCurveTo(w*0.35,yy-5,w*0.65,yy+5,w-12,yy);
    ctx.stroke();
  }
  ctx.strokeStyle="rgba(255,240,210,0.22)"; ctx.lineWidth=2;
  rr(ctx,11,11,w-22,h-22,9); ctx.stroke();
  // console gets little decor items
  if(f.name==="console"){
    ctx.fillStyle="#c98b53"; ctx.beginPath();
    ctx.ellipse(w*0.26,h*0.5,13,9,0,0,7); ctx.fill();           // bowl
    ctx.fillStyle="#7fae9a"; rr(ctx,w*0.5-9,h*0.5-15,18,30,4); ctx.fill(); // vase
    ctx.fillStyle="#5b8f78"; ctx.beginPath();
    ctx.ellipse(w*0.5,h*0.5-16,13,9,0,0,7); ctx.fill();          // plant
    ctx.fillStyle="#d8d2c4"; rr(ctx,w*0.72,h*0.5-12,22,24,3); ctx.fill(); // frame
    ctx.fillStyle="#9aa7b0"; rr(ctx,w*0.72+3,h*0.5-9,16,18,2); ctx.fill();
  }
  ctx.strokeStyle="rgba(30,20,10,0.5)"; ctx.lineWidth=2.2;
  rr(ctx,1,1,w-2,h-2,16); ctx.stroke();
}

// ---- robot vacuum ----
function drawRobot(){
  const x=robot.x,y=robot.y;
  ctx.save();
  ctx.translate(x,y);
  // shadow
  ctx.fillStyle="rgba(20,35,30,0.28)"; ctx.filter="blur(4px)";
  ctx.beginPath(); ctx.ellipse(3,7,ROBOT_R*0.95,ROBOT_R*0.7,0,0,7); ctx.fill();
  ctx.filter="none";
  // spinning side brush
  ctx.save(); ctx.rotate(brushSpin);
  ctx.strokeStyle="#c9a23a"; ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*ROBOT_R*0.7,Math.sin(a)*ROBOT_R*0.7);
    ctx.lineTo(Math.cos(a)*(ROBOT_R+5),Math.sin(a)*(ROBOT_R+5));
    ctx.stroke();
  }
  ctx.restore();
  // body
  ctx.fillStyle="#3b414b"; ctx.beginPath(); ctx.arc(0,0,ROBOT_R,0,7); ctx.fill();
  ctx.fillStyle="#4d5663"; ctx.beginPath(); ctx.arc(0,0,ROBOT_R*0.82,0,7); ctx.fill();
  // top plate
  const tg=ctx.createRadialGradient(-7,-9,3,0,0,ROBOT_R*0.8);
  tg.addColorStop(0,"#6b7585"); tg.addColorStop(1,"#3f4651");
  ctx.fillStyle=tg; ctx.beginPath(); ctx.arc(0,0,ROBOT_R*0.62,0,7); ctx.fill();
  // bumper accent
  ctx.strokeStyle="#ffd34d"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,0,ROBOT_R*0.9,-0.9,0.9); ctx.stroke();
  // center button / light
  ctx.fillStyle= (mode==="vacuum") ? "#56e0c0" : "#8b97a4";
  ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,0.7)";
  ctx.beginPath(); ctx.arc(-2,-2,2.4,0,7); ctx.fill();
  // glossy highlight
  ctx.fillStyle="rgba(255,255,255,0.20)";
  ctx.beginPath(); ctx.ellipse(-ROBOT_R*0.3,-ROBOT_R*0.38,ROBOT_R*0.4,ROBOT_R*0.2,-0.6,0,7); ctx.fill();
  ctx.restore();
}

// ---- main loop ----
function frame(ts){
  const dt=Math.min(40,ts-lastTime||16); lastTime=ts;
  brushSpin += (mode==="vacuum"?0.4:0.12);
  // update particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x += (robot.x-p.x)*0.35; p.y += (robot.y-p.y)*0.35;
    p.life -= 0.07;
    if(p.life<=0) particles.splice(i,1);
  }
  // confetti
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];
    c.x += c.vx + Math.sin((c.y+c.phase)/38)*0.8;
    c.y += c.vy; c.vy=Math.min(c.vy+0.05,5.2); c.rot+=c.vr;
    if(c.y>H+30) confetti.splice(i,1);
  }
  render();
  requestAnimationFrame(frame);
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(bgImg) ctx.drawImage(bgImg,0,0,W,H);
  // sheen (freshly vacuumed) sits on clean carpet, under dust+furniture
  ctx.drawImage(sheen,0,0);
  // dust
  ctx.drawImage(dust,0,0);
  // furniture (not lifted), back-to-front by y
  const rest=FURN.filter(f=>!f.lifted).sort((a,b)=>(a.y+(a.dy||0))-(b.y+(b.dy||0)));
  for(const f of rest) drawFurniture(f);
  // dust particles being sucked up
  for(const p of particles){
    ctx.fillStyle="rgba(90,80,64,"+(p.life*0.8)+")";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,7); ctx.fill();
  }
  // robot
  if(robotShown && started && !finished) drawRobot();
  // lifted furniture on top
  for(const f of FURN) if(f.lifted) drawFurniture(f);
  // confetti
  for(const c of confetti){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.fillStyle=c.col;
    ctx.fillRect(-c.size/2,-c.size/3,c.size,c.size*0.66);
    ctx.restore();
  }
}

// ---- input ----
function evtPos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
}
function onDown(e){
  if(!started||finished) return;
  e.preventDefault();
  const p=evtPos(e);
  robot.x=p.x; robot.y=p.y; robotShown=true;
  const f=furnitureAt(p.x,p.y);
  if(f){
    mode="furn-pending"; pendStart=p; grabFurn=f;
    holdTimer=setTimeout(()=>{ if(mode==="furn-pending") startFurnitureGrab(f,p); }, HOLD_MS);
  }else{
    mode="vacuum"; lastV={x:p.x,y:p.y}; vacuumTo(p);
  }
}
function onMove(e){
  if(!started||finished||mode==="idle") return;
  e.preventDefault();
  const p=evtPos(e);
  if(mode==="vacuum"){ vacuumTo(p); }
  else if(mode==="furn-pending"){
    if(Math.hypot(p.x-pendStart.x,p.y-pendStart.y)>16){
      clearTimeout(holdTimer);
      mode="vacuum"; lastV={x:pendStart.x,y:pendStart.y}; vacuumTo(p);
    }
  }
  else if(mode==="furn-drag"){ dragFurnitureTo(p); }
}
function onUp(e){
  if(!started) return;
  clearTimeout(holdTimer);
  if(mode==="furn-pending"){ jiggle(grabFurn); grabFurn=null; }
  else if(mode==="furn-drag"){ dropFurniture(); }
  else if(mode==="vacuum"){ vacSound(false,0); robotShown=true; }
  mode="idle"; lastV=null;
}
canvas.addEventListener("mousedown",onDown);
canvas.addEventListener("mousemove",onMove);
window.addEventListener("mouseup",onUp);
canvas.addEventListener("touchstart",onDown,{passive:false});
canvas.addEventListener("touchmove",onMove,{passive:false});
window.addEventListener("touchend",onUp);

// ---- buttons ----
document.getElementById("startBtn").onclick=()=>{
  initAudio();
  if(actx&&actx.state==="suspended") actx.resume();
  document.getElementById("startScreen").style.display="none";
  started=true; robotShown=true;
  showMsg("Drag the robot to suck up all the dust!",2600);
};
document.getElementById("againBtn").onclick=()=>resetGame();
document.getElementById("doneBtn").onclick=()=>{ if(started&&!finished) finish(false); };
document.getElementById("soundBtn").onclick=()=>{
  muted=!muted;
  document.getElementById("soundBtn").innerHTML= muted? "&#128263;":"&#128266;";
  if(muted) vacSound(false,0);
};

function resetGame(){
  cellCov=new Uint8Array(COLS*ROWS);
  coveredCount=0; sweptArea=0; finished=false; movedAny=false;
  furnHintShown=false; tapHints=0; particles=[]; confetti=[];
  for(const k in milestones) milestones[k]=false;
  for(const f of FURN){ f.dx=0; f.dy=0; f.lifted=false; f.jig=0; f.pulse=0; f.wob=0; }
  shctx.clearRect(0,0,W,H);
  // rebuild dust
  const t=document.createElement("canvas"); t.width=W; t.height=H;
  const tg=t.getContext("2d"); tg.drawImage(_mask,0,0,W,H);
  buildDust(tg.getImageData(0,0,W,H));
  document.getElementById("results").classList.remove("show");
  mode="idle"; robotShown=true; updateHUD();
}

// ---- fit canvas to screen ----
function fit(){
  const wrap=document.getElementById("boardWrap");
  const aw=wrap.clientWidth, ah=wrap.clientHeight;
  const scale=Math.min(aw/W, ah/H);
  canvas.style.width=(W*scale)+"px";
  canvas.style.height=(H*scale)+"px";
}
window.addEventListener("resize",fit);
new ResizeObserver(fit).observe(document.getElementById("boardWrap"));

// boot
(function boot(){
  if(imgReady && maskReady){ fit(); updateHUD(); requestAnimationFrame(frame); }
  else setTimeout(boot,60);
})();
</script>
